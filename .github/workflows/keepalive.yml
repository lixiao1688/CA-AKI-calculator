name: keepalive

on:
  schedule:
    # 每 6 小时运行一次（UTC），远低于 12 小时睡眠阈值
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install chromium --with-deps
      - run: python keepalive.py
